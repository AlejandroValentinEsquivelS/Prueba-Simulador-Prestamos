<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Préstamos</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Simulador de Préstamos</h1>
    <div class="container">
        <label>Monto Crédito:</label>
        <input type="number" id="montoSolicitado" placeholder="Ingrese el monto del crédito solicitado">
        
        <label>Plazo (meses):</label>
        <select id="plazoCredito">
            <option value="6">6 meses</option>
            <option value="12">12 meses</option>
            <option value="24">24 meses</option>
        </select>
        <button id="calcularBtn" style="text-align: center;" >Calcular Cuota</button>
        <div id="resultado"></div>
    </div>
    <script src="credito.js"></script>
</body>
</html>
